<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; justify-content: center; color: blue;">
    <!--this section brings my content to the center-->
    <section>
        <header style=" display: flex; justify-content: center;">Sign-up Form</header>

       <form style="display: flex; flex-direction: column; border: 2px black solid; justify-content: center; padding: 20px;
          gap: 10px; border: 2px blue solid;">
         <div style="display: flex; justify-content: center;">
          <p style="font-size: 25px;">
             Fill in this form
          </p>
         </div>
          <!--this div is for name input-->
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <label for="name" style="font-size: 20px; font-style: italic;font-weight: 800; color: blue;">Name:</label>
            <input type="text" placeholder="input your name" style="border: none; border-bottom: 1px black solid;">
          </div>
           <!--this div is for password input-->
           <div style="display: flex; flex-direction: column; gap: 10px;">
            <label for="password" style="font-size: 20px; font-style: italic; font-weight: 800; color: blue;">Password</label>
            <input type="number" placeholder="input your password" style="border: none; border-bottom: 1px black solid;">
            </div>
            <!--this dv is for email-->
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label for="email" style="font-size: 20px; font-size: 800; color: blue;">Email</label>
                <input type="email" placeholder="input your email" style="border: none; border-bottom: 1px black solid;">
            </div>
            <div style="display: flex; justify-content: center;">
                <button style="border-radius: 30px; border-color: blue; background-color: red;"> 
                    Submit
                </button>
            </div>
        
        
        </form>
    </section>
</body>
</html>
